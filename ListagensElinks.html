<!--NAVEGAÇÃO, LISTAS E LINKS-->
<!--NAVEGAÇÃO-->
<!--Usamos quando precisamos identificar um determindado bloco de navegação (links).-->

<!--Representado pela Tag <nav></nav-->

<!--Nem todos os links de um documento devem estar em um elemento <nav></nav>.

O elemento <nav></nav> destina-se apenas ao bloco principal de links de navegação.-->

<!--LISTAS-->
<!--Como o nome já diz ela faz a listagem de conteúdo.

Representadas pelas Tags:

<ul> Agrupador da lista (não ordenada)
    <li></li> ->Item da lista
</ul>

<ol> ->Agrupador da lista (ordenada)
    <li></li> ->Item da lista
</ol>

Ok, mas qual a diferença na lista do ul para ol?

Agrupadores de Lista
<ul> -> - Não ordenada
    .<li></li> Item da lista -> Mostra o conteúdo sem critérios de ordenção.(como essa bolinha ao lado)
    
<ol> -> - Ordenada
    1. <li></li> Item da lista -> Mostra o conteúdo com critérios de ordenação. (como o número 1..2..3..4 ao lado)
    
LINKS
Link faz a ligação conectando uma página a outra em nosso HTML.
Existem 2 tipos de ligações internas e externas.

Internas -> Páginas do nosso site
Externas -> Páginas de outros sites

Representado pela Tag <a></a>
Porém para fazer essas ligações entre as páginas, usando apenas a tag <a></a> sozinha não acontece nada.
Devemos usar um de seus atributos chamado href.

Exemplo:
<a href="minha-pagina.html">Minha Página</a>
Assim usando o href conseguimos fazer com que o usuário navegue para outras páginas.
-->
