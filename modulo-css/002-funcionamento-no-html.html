<!--- CSS Externo 
A maneira mais conveniente de adicionar CSS a um documento HTML é através de um arquivo externo. Isso permite reutilizar estilos em múltiplas páginas e facilita a manutenção do código. A maneira mais conveniente de adicionar CSS ao seu site, é vinculá-lo a um arquivo .CSS externo. 

Dessa forma, quaisquer alteações feitas em um arquivo CSS exteno serão refletidas em seu site globalmente. 

CSS interno 
Código CSS interno é colocado dentro da tag <style> no interior do elemento <head> do documento HTML. 

As classes e IDs podem ser definidos e aplicados diretamente ao HTML. 

As classes e IDs podem ser usados para se referir ao código CSS. 
Mas eles só estão ativos nessa página específica. 

CSS inline 
Código CSS inline é colocado diretamente no elemento HTML usando o atributo style. 

O atributo STYLE é usado para formatar elementos HTML diretamente. 
específica

Usar CSS desta forma não é recomendado para projetos maiores, pois torna o código mais difícil de manter e reutilizar. 
Usar CSS desta forma não é recomendado, pois cada tag HTML precisa ser denominada individualmente.
