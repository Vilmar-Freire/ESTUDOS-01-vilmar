<!--- Herança no CSS -
Em uma família de elementos, as propriedades CSS podem ser herdadas de um elemento pai para seus filhos. Isso significa que se você definir uma propriedade em um elemento, todos os seus descendentes herdarão esse valor, a menos que seja sobrescrito. 

Quando criamos nosso código temos um amaranhado de propriedades que podem ser herdadas. 

<article> =====>Pai
<p>Texto Pai</p>  ===> Texto do Pai

    <section>=====> Filho

      <p>Texto Filho</p> ===> Texto do Filho 

      <ul> =======>Lista do Filho
          <li>Item 1</li> ===>Lista do Filho  1
          <li>Item 2</li> ===> Lista do Filho 2
          <li>Item 3</li> ===> Lista do Filho 3
          <li>Item 4</li> ===> Lista do Filho 4
      </ul>

      <div>=====>Div neto
          <p>Texto Neto</p> =====> Texto do Neto
      </div> 
    </section> 
</article>


--->
