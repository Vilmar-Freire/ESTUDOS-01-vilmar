<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="author" content="Vilmar Freire">
  <meta name="description" content="Criação de um formulário">
  <meta name="keywords" content="HTML, CSS, JavaScript, Formulário, Criação de Formulário">
  <link rel="stylesheet" href="./PASTA-GUSTAVO-CSS/prof-gustavo-00001.css" type="text/css">
  <script src="./PASTA-GUSTAVO-JAVSCRIPT/prof-gustavo-00001.JavaScript" async></script>
  <link rel="icon" type="image/x-icon" href="./ICONES/12-galinha2716918.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Personagem</title>
</head>
<body>
      <form class="create-character-form">
            <div class="title-container">
                  <h1>Crie seu personagem</h1>
                  <span>Seja bem criativo :)</span>
            </div>

            <fieldset>
                  <div class="form-row">
                  </div>

                  <div class="form-row">
                    <p  class="input-container">
                      <label for="character-name">Nome</label>
                      <input type="text" id="character-name" name="character-name">
                      </p>

                      <p  class="input-container">
                      <label for="last-name">Sobre-nome</label>
                      <input type="text" id="character-name" name="character-name">
                      </p>

                      
                  </div>

                  <div class="form-row">
                       <p>
                      <label for="birth-date">Data de nascimento</label>
                      <input type="date" id="birth-date" name="birth-date" required>
                       </p>

                       <p class="input-container">
                        <label for="initial-level">Level inicial</label>
                        <input type="number" id="initial-level" name="initial-level" min="0" max="100" required>
                       </p>
                  </div>

                  <p class="input-container">
                    <label for="character-class">Classe</label>
                    <select id="character-class" name="character-class" required>
                      <option value="">Selecione uma classe</option>
                      <option value="assassin">Assassino</option>
                      <option value="warrior">Guerreiro</option>
                      <option value="mage">Mago</option>
                      <option value="ranger">Arqueiro</option>
                      <option value="paladin">Paladinho</option>
                    </select>
                  </p>

                  <p class="input-container specific-skills-container">
                    <label class="specific-skills-title">
                        Quais são suas habilidades?
                        <span>No máximo 2</span>
                    </label>

                    <label for="healing">
                      <input type="checkbox" id="healing" name="skill" value="healing">
                      Cura
                    </label>

                    <label for="paison">
                      <input type="checkbox" id="paison" name="skill" value="paison">
                      Veneno
                    </label>

                    <label for="one-shot">
                      <input type="checkbox" id="one-shot" name="skills" value="one-shot">
                      One shot
                    </label>

                    <label for="levitation">
                      <input type="checkbox" id="levitation" name="skills" value="levitation">
                      Levitação
                    </label>

                    <label for="sword-slash">
                      <input type="checkbox" id="sword-slash" name="skills" value="sword-slash">
                      Sword slash
                    </label>

                   <label for="fireball">
                      <input type="checkbox" id="fireball" name="skills" value="fireball">
                      Fireball
                    </label>
                  </P>

                  <p class="input-container input-range-container">
                    <label for="strength">Nível de força</label>
                    <input type="range" id="strength" name="strength" min="1" max="100" value="50" id="strength" name="strength" required class="input-range">
                    <span class="input-range-value">0</span>
                  </p>

                   <p class="input-container input-range-container">
                    <label for="widsom">Nível de inteligencia</label>
                    <input type="range" id="widsom" name="widsom" min="1" max="100" value="50" id="widsom" name="widsom" required class="input-range">
                    <span class="input-range-value">0</span>
                  </p>

                  <p class="input-container character-image-container">
                    <label for="character-image">
                         Envie uma foto do seu personagem
                         <spam>Opcional - Formatos aceitos: PNG, JPG,  JPEG e GIF</spam>
                    </label>
                    <input type="file" id="character-image" name="character-image" name="character-image" accept=".png, .jpg, .jpeg, .gif" required>
                  </p>

                  <p class="input-container">
                    <label for="origin">Conte um pouco da origem do seu personagem</label>
                    <textarea id="origin" name="origin" rows="4" cols="50" placeholder="Digite a origem do seu personagem aqui..."  minlength="30" maxlength="180"   required></textarea>
                  </p>

                  <p class="input-container">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                  </p>
            </fieldset>
      </form>
</body>
</html>
