<!--TABELAS  
Quando devemos usar tabelas? Usamos quando se tem um conjunto de dados e precisa ser apresentados ordenadamente. É representada pela Tag <table></table>. Nunca usamos apenas a tag <table></table>, junto a elas temos outras tags como: 
    <table> => Representa a tabela
        <tr></tr> => Representa uma linha da tabela  =>Representa uma linha da coluna
        <th></th> => Representa um cabeçalho da tabela => Representa o título da coluna
        <td></td> => Representa uma célula de dados da tabela  => Representa o conteúdo da coluna => e   Representa o conteúdo da linha da coluna
        <tr></tr> -> Representa uma linha da tabela => Representa uma linha da coluna
    </table> => Representa a tabela

DICAS DE OURO SOBRE TABELAS
Uma tabela tem mais atributos, eles são:
    <thead> => Representa o cabeçalho da tabela =>separa o cabeçario da tabela do corpo da tabela.
    </thead>

    <tbody> => Representa o corpo da tabela => separamos o corpo da tabela do rodapé da tabela.
    </tbody>

    <tfoot> => Representa o rodapé da tabela => separamos o rodapé da tabela do corpo da tabela.
    </tfoot>
    
Vamos ver o resultado de uma tabela na prática:

                              ID E CLASS
As tabelas tem os mesmos atributos de ID e CLASS, ou seja, podemos usar o ID para identificar uma tabela e o CLASS para identificar um grupo de tabelas.

Id e Class são atributos globais, ou seja, podem ser usados em qualquer elemento HTML.

Id e Class tem a mesma função, ou seja, identificar um elemento HTML, a diferença é que o Id é usado para identificar um elemento HTML específico, ou seja, um elemento HTML único, já o Class é usado para identificar um grupo de elementos HTML, ou seja, vários elementos HTML.

Id e Class são usados para estilizar uma tabela, ou seja, para aplicar estilos CSS em uma tabela, usando o ID ou o CLASS da tabela.

Id e Class são usados para manipular uma tabela usando JavaScript, ou seja, para aplicar funcionalidades em uma tabela, usando o ID ou o CLASS da tabela.

Id e Class são uma forma de identificar elementos em seu html.

É muito importante saber usá-los pois são muito utilizados em todos os códigos por aí na internet.

Vamos utilizá-los com css ou javascript, para isso precisamos colocar o ID ou o CLASS na tag da tabela, por exemplo:   
    <table id="tabela1">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Vilmar</td>
            <td>63</td>
            <td>Araruna-pr</td>
        </tr>
    </table>

    <table class="tabela2">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Paulo</td>
            <td>22</td>
            <td>Araruna-pr</td>
        </tr>
    </table>
    Mas  tudo depende de minha utilizações.

    Lembra dos elementos que aprendemos nas outras aulas?

    Neles conseguimos usar os seletores (id ou class), cada um deles tem uma determinada importância na sintaxe de nosso código. Cada id tem um nome próprio por página, isso mesmo, apenas 1 nome de id por página, já o class pode ser usado quantas vezes quiser, ou seja, vários elementos HTML podem ter o mesmo nome de class.

    Se em uma página tiver mais de um elemento HTML com o mesmo nome de id, isso é um erro, pois o id é usado para identificar um elemento HTML específico, ou seja, um elemento HTML único, já o class é usado para identificar um grupo de elementos HTML, ou seja, vários elementos HTML. Se em sua página tiver mais de 1 id com nome igual está incorreto. É importante lembrar disso, pois pode causar problemas em seu código, principalmente quando for usar o id para estilizar ou manipular um elemento HTML usando CSS ou JavaScript.

    É como se fossem impressões digitais de nossos dedos ou RG de nossas cores, cada um tem um nome único, ou seja, cada um tem uma impressão digital única, ou seja, cada um tem um RG único, ou seja, cada um tem um nome de id único. Já o class é como se fosse uma roupa, ou seja, várias pessoas podem usar a mesma roupa, ou seja, vários elementos HTML podem ter o mesmo nome de class.

    Alguns exemplos de id e class em tabelas:
    <table id="tabela1">< /table>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Vilmar</td>
            <td>63</td>
            <td>Araruna-pr</td>
        </tr>
