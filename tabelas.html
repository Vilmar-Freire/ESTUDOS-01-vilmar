<!--TABELAS  
Quando devemos usar tabelas? Usamos quando se tem um conjunto de dados e precisa ser apresentados ordenadamente. É representada pela Tag <table></table>. Nunca usamos apenas a tag <table></table>, junto a elas temos outras tags como: 
    <table> => Representa a tabela
        <tr></tr> => Representa uma linha da tabela  =>Representa uma linha da coluna
        <th></th> => Representa um cabeçalho da tabela => Representa o título da coluna
        <td></td> => Representa uma célula de dados da tabela  => Representa o conteúdo da coluna => e   Representa o conteúdo da linha da coluna
        <tr></tr> -> Representa uma linha da tabela => Representa uma linha da coluna
    </table> => Representa a tabela

DICAS DE OURO SOBRE TABELAS
Uma tabela tem mais atributos, eles são:
    <thead> => Representa o cabeçalho da tabela =>separa o cabeçario da tabela do corpo da tabela.
    </thead>

    <tbody> => Representa o corpo da tabela => separamos o corpo da tabela do rodapé da tabela.
    </tbody>

    <tfoot> => Representa o rodapé da tabela => separamos o rodapé da tabela do corpo da tabela.
    </tfoot>
