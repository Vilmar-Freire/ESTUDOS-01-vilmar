  <meta name="description" content="A unidade de medida 'em' é relativa ao tamanho da fonte do elemento pai. Por exemplo, se o elemento pai tiver um tamanho de fonte de 16 pixels, 1em será igual a 16 pixels. Se o elemento pai tiver um tamanho de fonte de 20 pixels, 1em será igual a 20 pixels. Isso torna a unidade 'em' útil para criar layouts responsivos, pois os elementos podem se ajustar automaticamente com base no tamanho da fonte do elemento pai.">
  <meta name="keywords" content="CSS, unidade de medida, em, tamanho da fonte, elemento pai, layouts responsivos">
