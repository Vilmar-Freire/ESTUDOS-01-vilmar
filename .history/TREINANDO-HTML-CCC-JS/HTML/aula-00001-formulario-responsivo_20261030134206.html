<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="pt-BR">
    <meta name="author" content="Vilmar Freire">
    <meta name="description" content="Curso de HTML, CSS e JS - Aula 00001 - Formulário Responsivo">
    <meta name="keywords" content="Curso, HTML, CSS, JS, Formulário, Responsivo">
    <link rel="shortcut icon" href="../ICONES copy/01-cachorro-reto91536.png" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/aula-00001-formulario-responsivo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Responsivo</title>
    <script src="../JS/aula-00001-formulario-responsivo.js" defer></script>
</head>
<body>
    <div class="form-container">
        <h2>Formulário Responsivo</h2>
        <form>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Telefone:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Digite seu telefone" required>
                </div>

            </div>
        </form>
    </div>
</body>
</html>
