<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Programacao, html, css, JavaScript">
    <meta name="language" content="pt-BR">
    <meta name="Description" content="Formularios">
    <meta name="author" content="Vilmar-Freire">
    <link rel="shortcut icon" href="./ICONES/18-galinha6591130.png" type="image/x-icon">
    <link rel="stylesheet" href="./formularios-00001.css">
    <script src="./formularios-00001.js"></script>
    <title>Forulários</title>
</head>
<body>
    <div class="content">
        <h1>Formulario</h1>
        <form>
            <div>
                <input type="text" placeholder="Digite seu nome" class="inputs">
                <span class="span-requird">Nome deve ter no mínimo 3 caracteres</span>
            </div>
            <div>
                <input type="email" placeholder="Digite seu melhor email" class="inputs">
                <span class="span-requird">Digite um email válido</span>
            </div>
            <div>
                <input type="password" placeholder="Senha" class="inputs">
                <span class="span-requird">Digite uma senha com no mínimo 8 caracteres</span>
            </div>
            <div>
                <input type="password" placeholder="Repita sua senha" class="inputs">
                <span class="span-requird">Senhas devem ser compatíveis</span>
            </div>
            <textarea name="descricao" id="descricao" cols="25" rows="10" placeholder="Fale um pouco sobre você..."></textarea>

            <p>Sexo:</p>
            <div class="box-select">
                <div>
                    <input type="radio" id="m" value="m" name="Sexo">
                    <label for="m">Maculino</label>
                </div>
                <div>
                    <input type="radio" id="f" value="f" name="Sexo">
                    <label for="f">Feminino</label>
                </div>
                <div>
                    <input type="radio" id="o" value="o" name="Sexo">
                    <label for="o">Outro</label>
                </div>
        </div>

        <p>Quais suas experiências ?</p>
        <div class="box-select">
            <div>
                <input type="checkbox" id="html" value="html" name="experiencias">
                <label for="html">Masculino</label>
            </div>
            <div>
                <input type="checkbox" id="css" value="css" name="experiencias">
                <label for="css">Css</label>
            </div>
            <div>
                <input type="checkbox" id="Js" value="Js" name="experiencias">
                <label for="Js">JavaScript</label>
            </div>
            <div>
                <input type="checkbox" id="php" value="php" name="experiencias">
                <label for="php">PHP</label>
            </div>
        </div>
        <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
