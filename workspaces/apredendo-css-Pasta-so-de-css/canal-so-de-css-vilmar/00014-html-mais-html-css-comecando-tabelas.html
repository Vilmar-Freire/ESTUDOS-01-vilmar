  <body>
        <p>
          O uso da cor é uma forma fundamental de expressão humana.
        </p>

        <div class="responsive-table">
          <table>
            <caption>Uma descrição para tabela</caption>
            <thead>
                <tr>
                   <th>Título 1</th>
                   <th>Título 2</th>
                   <th>Título 3</th>
                </tr>
            </thead>

            <tbody>
                 <tr>
                     <td>Vilmar-Freire=Vilmar-Freire</td>
                     <td>Corpo 2</td>
                     <td>Corpo 3</td>
                 </tr>

                 <tr>
                     <td colspan="2"
                     rowspan="2">AQUI</td>
                     <td>Corpo 3</td>
                 </tr>

                 <tr>
                    <td>Corpo 3</td>
                 </tr>
            </tbody>

            <tfoot>
              <tr>
                     <td colspan="2" rowspan="2"></td>
                     <td rowspan="3">TOTAL: <br> R$555</td>
              </tr>
            </tfoot>
          </table>
       </div>
  </body>

<!--
<table> =>Para construir uma tabale usa-se a tag table
<thead> => É o cabeçalho da tabela
<tr> => É a linha da tabela.
<th>Título 1</th> => Para colunas eu utilizo duas tags ou TD ou PH como eu estou falando de TR eu uso TH aqui.
<td></td> Para colunas eu utilizo duas tags ou TD ou PH como eu estou falando de TR eu uso TH aqui.
<tbody></tbody> => Cria o corpo da tabela eu preciso dessa tag para criar o corpo da tabela.
<tfoot></tfoot> => Cria o rodapé da tabela.
<td colspan="3"></td> => Faz com que ocupa três espaços de coluna linha horizontal
<td colspan="2"
rowspan="">AQUI</td> <td>Corpo 3</td> => Ocupa a parte de baixo da linha vertical.



-->
