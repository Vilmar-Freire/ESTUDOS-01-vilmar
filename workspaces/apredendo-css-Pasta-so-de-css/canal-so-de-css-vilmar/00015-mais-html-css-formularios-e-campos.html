<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Progamacao, html, css, JavaScript">
    <meta name="Description" content="Formulários e campos ">
    <meta name="language" content="pt-BR">
    <meta name="author" content="Vilmar-Freire">
    <link rel="stylesheet" href="./00015-mais-html-css-formularios-e-campos.css">
    <link rel="shortcut icon" href="./ICONES/27-elefante490001.png" type="image/x-icon">
    <title>Formulários-e-campos</title>
</head>
<body>

            <form action="#" method="get"  
            target="_blank" autocomplete="off">
            <p>O meu formulário</p>

               <p>
                <label for="nome">Nome:</label>
                <input  type="text" id="nome" name="nome" placeholder="Seu nome">
            </p>

            <p>
                <label  for="dev1">Sou um dev</label>
                <input  type="checkbox" id="dev1" name="dev1" value="sim"><br>

                <label  for="dev2">Sou um dev</label>
                <input  type="checkbox" id="dev2" name="dev2" value="sim"  checked><br>

                <label  for="dev3">Sou um dev</label>
                <input  type="checkbox" id="dev3" name="dev3" value="sim"><br>
            </p>

             <p>
                Gênero: <br>
                <label  for="feminino">feminino</label>
                <input  type="radio" id="feminino" name="Gênero" value="feminino"><br>

                <label  for="masculino">masculino</label>
                <input  type="radio" id="masculino" name="Gênero" value="masculino" checked><br>

                <label  for="outro_outra">Outro ou Outra</label>
                <input  type="radio" id="outro_outra" name="Gênero" value="outro_outra"><br>
            </p>

            <p>
                <label for="nome">Date:</label>
                <input  type="date" id="date" name="date" value="2026-07-07">
            </p>

            <p>
                <label for="datetime">Date-horas:</label>
                <input  type="datetime-local" id="datetime" name="datetime" value="2026-07-07T21:04">
            </p>

            <p>
                <label for="time">Horas:</label>
                <input  type="time" id="time" name="time" value="21:04:01">
            </p>

             <p>
                <label for="cor">Cor preferida</label>
                <input  type="color" id="cor" name="cor" value="#ffff00">
            </p>

            <p>
                <label for="email">Seu e-mail</label>
                <input  type="email" id="email" name="email" placeholder="ex.: email@email.com">
            </p>

            <p>
                <label for="file">Sua foto</label>
                <input  type="file" id="file" name="file" accept=".png, svg, image/*" multiple>
            </p>

            <p>
                <button type="reset">Reset</button>
                <button type="submit">Enviar</button>
            </p>

            </form>
</body>
</html>

<!--
fieldset => Serve para agrupar os campos de um formulário.
required => mostra a mensagem no site quando tenta mandar o formulário sem preencher.
checked => mostra ele marcado não precisa eu marcar ele já vem marcado por padrão



-->
