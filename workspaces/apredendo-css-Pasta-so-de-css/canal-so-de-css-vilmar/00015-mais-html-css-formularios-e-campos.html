<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Progamacao, html, css, JavaScript">
    <meta name="Description" content="Formulários e campos ">
    <meta name="language" content="pt-BR">
    <meta name="author" content="Vilmar-Freire">
    <link rel="stylesheet" href="./00015-mais-html-css-formularios-e-campos.css">
    <link rel="shortcut icon" href="./ICONES/27-elefante490001.png" type="image/x-icon">
    <title>Formulários-e-campos</title>
</head>
<body>

            <form action="#" method="get"  
            target="_blank" autocomplete="off">
            <p>O meu formulário</p>

               <p>
                <label for="nome">Nome:</label>
                <input  type="text" id="nome" name="nome" placeholder="Seu nome">
            </p>

            <p>
                <label  for="dev1">Sou um dev</label>
                <input  type="checkbox" id="dev1" name="dev1" value="sim"><br>

                <label  for="dev2">Sou um dev</label>
                <input  type="checkbox" id="dev2" name="dev2" value="sim"  checked><br>

                <label  for="dev3">Sou um dev</label>
                <input  type="checkbox" id="dev3" name="dev3" value="sim"><br>
            </p>

             <p>
                Gênero: <br>
                <label  for="feminino">feminino</label>
                <input  type="radio" id="feminino" name="Gênero" value="feminino"><br>

                <label  for="masculino">masculino</label>
                <input  type="radio" id="masculino" name="Gênero" value="masculino" checked><br>

                <label  for="outro_outra">Outro ou Outra</label>
                <input  type="radio" id="outro_outra" name="Gênero" value="outro_outra"><br>
            </p>

            <p>
                <label for="nome">Date:</label>
                <input  type="date" id="date" name="date" value="2026-07-07">
            </p>

            <p>
                <label for="datetime">Date-horas:</label>
                <input  type="datetime-local" id="datetime" name="datetime" value="2026-07-07T21:04">
            </p>

            <p>
                <label for="time">Horas:</label>
                <input  type="time" id="time" name="time" value="21:04:01">
            </p>

             <p>
                <label for="cor">Cor preferida</label>
                <input  type="color" id="cor" name="cor" value="#ffff00">
            </p>

            <p>
                <label for="email">Seu e-mail</label>
                <input  type="email" id="email" name="email" placeholder="ex.: email@email.com">
            </p>

            <p>
                <label for="file">Sua foto</label>
                <input  type="file" id="file" name="file" accept=".png, svg, image/*" multiple>
            </p>

            <p>
                <label for="number">number</label>
                <input  type="number" id="number" name="number" placeholder="Digite um número" min="1" max="50">
            </p>

            <p>
                <label for="password">password</label>
                <input  type="password" id="password" name="password" placeholder="Digite sua senha">
            </p>

             <p>
                <label for="range">range</label>
                <input  type="range" id="range" name="range" min="0" max="10" step="2">
            </p>

                                                                                                                
<label for="temp">Choose a comfortable temperature:</label><br>
<input type="range" id="temp" name="temp" list="markers">

<datalist id="markers">
  <option value="0"></option>
  <option value="25"></option>
  <option value="50"></option>
  <option value="75"></option>
  <option value="100"></option>
</datalist>


<p>
  <label for="temp1">Temperature for room 1:</label>
  <input type="range" id="temp1" name="temp1" list="value">
</p>
<p>
  <label for="temp2">Temperature for room 2:</label>
  <input type="range" id="temp2" name="temp2" list="value">
</p>

<p>
  <label for="temp3">Temperature for room 3:</label>
  <input type="range" id="temp3" name="temp3" list="value">
</p>

<datalist id="values">
  <option value="0" label="0"></option>
  <option value="25" label="25"></option>
  <option value="50" label="50"></option>
  <option value="75" label="75"></option>
  <option value="100" label="100"></option>
</datalist>

                                                                             
<label for="tempB">Choose a comfortable temperature:</label><br>
<input type="range" id="tempB" name="tempB" list="value">

<datalist id="value">
  <option value="0" label="very cold!"></option>
  <option value="25" label="cool"></option>
  <option value="50" label="medium"></option>
  <option value="75" label="getting warm!"></option>
  <option value="100" label="hot!"></option>
</datalist>






            <p>
                <button type="reset">Reset</button>
                <button type="submit">Enviar</button>
            </p>

            </form>
</body>
</html>
