<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Progamacao, html, css, JavaScript">
    <meta name="Description" content="Formulários e campos ">

    <title>Formulários-e-campos</title>
</head>
<body>

            <form action="#" method="get"  
            target="_blank" autocomplete="off">
            <p>O meu formulário</p>

               <p>
                <label for="nome">Nome:</label>
                <input  type="text" id="nome" name="nome" placeholder="Seu nome">
            </p>

            <p>
                <label  for="dev">Sou um dev</label>
                <input  type="checkbox" id="dev" name="dev" value="sim" checked>
            </p>

            <p>
                <button type="reset">Reset</button>
                <button type="submit">Enviar</button>
            </p>

            </form>
</body>
</html>

fieldset => Serve para agrupar os campos de um formulário.
