<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta http-equiv="X_UA-compatible" content="ie=edge">
  <meta name="language" content="pt-BR">
  <meta name="author" content="Vilmar Freire">
  <meta name="keywords" content="Programacao, html, css, JavaScript">
  <meta name="description" content="Tabelas">
  <script src="./aula-00011-html-css-prof-otavio-miranda.js" defer></script>
  <link rel="stylesheet" href="./aula-00011-html-css-prof-otavio-miranda.css">
  <link rel="shortcut icon" href="./ICONES/01-cachorro-reto91536.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela</title>
</head>
<body>
    <p>Aprendendo tabela</p>

    <div class="responsive-table">
    <table> <!--Pra montar uma tabela usa-se essa tag table.-->
        <caption>Uma descrição para tabela</caption>
        <thead> <!--Representa o inicio da tabela-->
          <tr> <!--Representa a linha-->
              <th>Titulo 1</th> <!--Representa a coluna da tabela o título dela.-->
              <th>Titulo 2</th>
              <th>Titulo 3</th>
          </tr>
        </thead>

        <tbody> <!--Representa o corpo da tabela-->
          <tr> <!--Representa a linha que vai seguir.-->
              <td>Corpo 1</td> <!--Representa o conteúdo da tabela o que vai dentro dela.-->
              <td>Corpo 2</td>
              <td>Corpo 3</td>
          </tr>

          <tr>
              <td colspan="2" rowspan="2">aqui</td>
              <td>Corpo 3</td>
          </tr>

          <tr>
              <td>Corpo 3</td>
          </tr>
        </tbody>

        <tfoot>
            <tr>
                 <td  colspan="2" rowspan="2"></td>
                 <td rowspan="2">Total: <br> R$  555,00</td>
            </tr>
        </tfoot>
    </table>
    </div>
   </body>
</html>
