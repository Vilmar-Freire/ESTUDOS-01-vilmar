<body>

      <form action="#" method="get" target="_blank" autocomplete="off">
          <p>O meu formulário</p>

          <p>
              <label for="nome">Nome:</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome">
          </p>
          <p>

         <p>
              <label for="dev">Sou um dev</label>
              <input type="checkbox" id="dev" name="dev">
          </p>


              <button type="reset">Reset</button>
              <button type="submit">Enviar</button>
          </p>





          <p>
            <label for="Nome-E-Sobre-Nome">Nome-E-Sobre-Nome</label>
            <input type="text" id="Nome-E-Sobre-Nome" name="Nome-E-Sobre-Nome" placeholder="nome e sobre nome">
          </p>

          <p>
            <label for="Livro">Livro</label>
            <input type="checkbox" id="Livro" name="Livro">
          </p>

          <P>
          <label for="Femenino">Femenino</label>
          <input type="radio" id="Femenino" name="Femenino">
          </P>

          <P>
          <label for="Masculino">Masculino</label>
          <input type="radio" id="Masculino" name="Masculino">
          </P>

          <P>
          <label for="Outros">Outros</label>
          <input type="radio" id="Outros" name="Outros">
          </P>

          <p>
            <label for="E-mail">Digite seu E-mail:</label>
            <input type="E-mail" id="E-mail" name="E-mail">
            <input type="submit">
          </p>

          <p>
            <button type="reset">Resetar</button>
            <button type="submit">Enviar</button>
          </p>

         
      </form>
</body>
